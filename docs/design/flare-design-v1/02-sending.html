<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Flare · 02 Sending</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#fff;display:flex;justify-content:center;padding:24px 0}
@keyframes fl{0%{transform:scale(.8);opacity:.35}100%{transform:scale(1.1);opacity:0}}@media (prefers-reduced-motion:no-preference){.pulse{animation:fl 2.4s ease-out infinite}}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EAF0FB;color:#0B2545;font-family:'Instrument Sans',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;padding:6px 16px;min-height:56px;box-sizing:border-box;border-bottom:1px solid #CBD8EF">
    <span style="font-size:16px;font-weight:600">Urgență? Sună la</span>
    <a href="tel:112" style="display:inline-flex;align-items:center;justify-content:center;width:96px;height:44px;background:#C8102E;color:#fff;border-radius:12px;font-size:21px;font-weight:700;text-decoration:none">112</a>
  </div>
  <div style="background:#0B2545;color:#fff;border-radius:0 0 28px 28px;padding:18px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:#2457E6;display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.5" fill="#fff"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></span>
      <div><div style="font-size:26px;font-weight:700;line-height:1">Flare</div><div style="font-size:16px;color:#BCD0F5;margin-top:4px">Aeroportul Internațional Craiova</div></div>
    </div>
    <button type="button" aria-label="Schimbă limba în engleză" style="display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:transparent;color:#fff;border:1.5px solid #8FB2FF;border-radius:999px;font:600 16px 'Instrument Sans',sans-serif;cursor:pointer;white-space:nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>English</button>
  </div>
  <main style="flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 20px 0;box-sizing:border-box">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding-bottom:12px">
      <div aria-hidden="true" style="position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center">
        <div class="pulse" style="position:absolute;inset:0;border-radius:50%;background:#2457E6;opacity:.18"></div>
        <div style="position:absolute;inset:26px;border-radius:50%;background:#2457E6;opacity:.28"></div>
        <div style="width:58px;height:58px;border-radius:50%;background:#2457E6"></div>
      </div>
      <h1 role="status" style="margin:0;font-size:28px;font-weight:700;line-height:1.2">Verificăm mesajul…</h1>
      <p style="margin:0;font-size:18px;color:#44587A;line-height:1.5">Durează câteva secunde.<br>Nu închide pagina.</p>
      <blockquote style="margin:8px 0 0;width:100%;box-sizing:border-box;background:#fff;border-radius:20px;padding:16px 18px;font-size:20px;line-height:1.4;text-align:left"><span style="display:block;font-size:16px;color:#44587A;margin-bottom:4px">Ai scris</span>„Nu mi-a venit bagajul. Unde mă duc?”</blockquote>
    </div>
  </main>
<div style="padding:10px 20px 16px;font-size:16px;color:#44587A">Demonstrație cu date simulate</div>
</div>
</body>
</html>
