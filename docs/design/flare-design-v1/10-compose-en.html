<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flare · 10 Compose (EN)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#fff;display:flex;justify-content:center;padding:24px 0}

</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EAF0FB;color:#0B2545;font-family:'Instrument Sans',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;padding:6px 16px;min-height:56px;box-sizing:border-box;border-bottom:1px solid #CBD8EF">
    <span style="font-size:16px;font-weight:600">Emergency? Call</span>
    <a href="tel:112" style="display:inline-flex;align-items:center;justify-content:center;width:96px;height:44px;background:#C8102E;color:#fff;border-radius:12px;font-size:21px;font-weight:700;text-decoration:none">112</a>
  </div>
  <div style="background:#0B2545;color:#fff;border-radius:0 0 28px 28px;padding:18px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;background:#2457E6;display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.5" fill="#fff"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></span>
      <div><div style="font-size:26px;font-weight:700;line-height:1">Flare</div><div style="font-size:16px;color:#BCD0F5;margin-top:4px">Craiova International Airport</div></div>
    </div>
    <button type="button" aria-label="Switch language to Romanian" style="display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:transparent;color:#fff;border:1.5px solid #8FB2FF;border-radius:999px;font:600 16px 'Instrument Sans',sans-serif;cursor:pointer;white-space:nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>Română</button>
  </div>
  <main style="flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 20px 0;box-sizing:border-box">
    <label for="msg" style="font-size:28px;font-weight:700;line-height:1.15">What can we help you with?</label>
    <textarea id="msg" aria-describedby="msg-hint" rows="5" style="width:100%;box-sizing:border-box;min-height:176px;background:#fff;border:2px solid #2457E6;border-radius:20px;padding:16px;font:400 20px/1.4 'Instrument Sans',sans-serif;color:#0B2545;resize:none"></textarea>
    <p id="msg-hint" style="margin:-4px 0 0;font-size:18px;color:#44587A;line-height:1.4">Write in your own words. You can also dictate: tap the microphone on your keyboard.</p>
    <label style="display:flex;align-items:center;gap:12px;min-height:56px;box-sizing:border-box;background:#fff;border-radius:16px;padding:10px 16px;font-size:18px;cursor:pointer;color:#0B2545">
      <input type="checkbox" style="width:24px;height:24px;margin:0;accent-color:#2457E6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span>I’d like a call back (Optional)</span>
    </label>
    <button type="button" style="height:56px;width:100%;background:#2457E6;color:#fff;border:0;border-radius:16px;font:600 19px 'Instrument Sans',sans-serif;cursor:pointer">Send</button>
    <div style="font-size:16px;color:#44587A;line-height:1.5">We never ask for payments, passwords or personal documents.<br>This is not an emergency line.</div>
  </main>
<div style="padding:10px 20px 16px;font-size:16px;color:#44587A">Demo with simulated data</div>
</div>
</body>
</html>
