# Emergency phrases (pipeline.md step 4, A07 item 2). Matched as WHOLE phrases on normalised text:
# lower case, no diacritics (ș→s, ț→t, ă→a, â→a, î→i), punctuation turned into spaces. So write them
# without diacritics and without punctuation ("mi am pierdut copilul", "there s a fire").
#
# A match makes the message EMERGENCY: the Passenger sees the 112 instructions at once, and a Critical
# Issue goes to Security and the duty manager. It runs before every limit and before the LLM, so an
# outage never blocks it. A false positive costs little (staff can lower the Severity); a false negative
# is still covered by the 112 strip on every screen and, once enabled, by the LLM.
#
# Prefer specific phrases over single words where a single word has an everyday meaning at an airport:
# "fire" (fire exit, fire extinguisher), "incendiu" (iesire de incendiu), "smoke" / "fum" (smoke detector,
# detector de fum) are therefore only matched inside phrases. EmergencyDetectorTest guards these cases.
# All terms are an assumption to be reviewed by the team; they are not from the airport.

ro:
  # Fire and smoke
  - foc                      # "foc" on its own almost always means a fire; "stingator"/"iesire de incendiu" don't contain it
  - a luat foc
  - a izbucnit un incendiu
  - a izbucnit incendiu
  - este un incendiu
  - e un incendiu
  - miroase a fum
  - iese fum
  - e fum
  - este fum
  - plin de fum
  # Medical
  - nu respira
  - nu mai respira
  - a lesinat
  - lesinat
