# 'demo' profile: also loads the simulated demo seed (db/seed/R__demo_seed.sql, task D01).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# The demo runs on the LLM: here it defaults to on, so a missing env var can't silently leave every message on the fallbacks.
# FLARE_LLM_ENABLED=false still turns it off.
flare:
  llm:
    enabled: ${FLARE_LLM_ENABLED:true}
